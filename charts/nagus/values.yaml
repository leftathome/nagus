# Default values for the nagus chart. See charts/nagus/README-esque NOTES.txt.

image:
  # Deployable image published to GHCR by the GitHub mirror (same convention as
  # glovebox). The GitLab pipeline also builds to the in-cluster registry for
  # dev/test; the HelmRelease consumes the GHCR image.
  repository: ghcr.io/leftathome/nagus
  # tag defaults to .Chart.appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Which category bundle this release serves (v1 wires only "hdd").
category: hdd

# Multi-source mode: when `sources` is non-empty, the chart renders a config.json
# (mounted at /etc/nagus-config/config.json, NAGUS_CONFIG) describing N ingest
# sources and M category surfaces served by ONE deployment, and the legacy
# single-category env vars (category/serve.minCapacityTB/ingestInterval/ebay.query
# /land.*) are NOT emitted. Leave empty to keep the legacy single-category path.
sources: []
  # - {name: ebay, category: hdd, type: ebay, query: "internal hard drive", intervalMinutes: 30}
  # - {name: north-sound, category: land, type: zillapi, intervalMinutes: 1440, maxItems: 25,
  #    daysOnZillow: "7", bbox: {west: -123.141452, south: 48.055894, east: -121.868411, north: 48.673576}}
categories: {}
  # hdd:  {minCapacityTB: 8}
  # land: {minAcreageAcres: 1, budgetCents: 0}
# defaultCategory pins the read default when >1 category and a request omits ?category=.
defaultCategory: ""

# The long-running `nagus serve` process: the MCP server at /mcp (agent-facing,
# tools search_items + get_item) plus a plain-HTTP read-only pull at /search +
# /item, plus an optional in-process ingest loop (sqlite is single-writer, so one
# pod both ingests and serves -- no cross-pod file sharing).
serve:
  listen: ":8080"
  minCapacityTB: 6
  # ingestInterval "0" disables scheduled ingest (the surface still serves the
  # existing corpus). Set e.g. "30m" once a source is configured (ebay creds or
  # demo mode), otherwise startup fails fast with "ingest enabled but no source".
  ingestInterval: "0"
  # offline scores against the built-in demo reference instead of the live feed.
  offline: false

ebay:
  query: "internal hard drive"
  # Live-ingest credentials are injected as env from a Secret; NEVER inline them
  # here (they belong in Vault, synced via externalSecret below or a pre-made
  # Secret named in existingSecret). The Secret must expose the keys
  # NAGUS_EBAY_CLIENT_ID and NAGUS_EBAY_CLIENT_SECRET.
  existingSecret: ""

# demo.enabled makes the release self-contained and demonstrable with NO secrets
# and NO network: it mounts the bundled eBay fixture and turns on offline scoring
# + scheduled ingest, so `helm install ... --set demo.enabled=true` yields ranked
# results in-cluster. Turn OFF for real deployments.
demo:
  enabled: false
  ingestInterval: "1h"

# land-category tuning (only consumed when category: land). Scoring is
# structure-first; these set the budget + acreage window. Rentcast (paid,
# optional) supplies the structure/assessed-value signals -- without it, land
# surfaces as unassessed candidates.
#
# The land ACQUISITION source is Zillapi (type: zillapi in sources[]), which
# replaced the Craigslist RSS source Craigslist retired (nagus-hh5). Zillapi bills
# ONE CREDIT PER RESULT RETURNED, so a land source wants a DAILY intervalMinutes
# (1440), a small maxItems, and a daysOnZillow window -- see
# docs/design/2026-07-29-zillapi-land-connector.md before raising the cadence. The
# acreage/price window below is pushed upstream by the connector, so it is a spend
# control as well as a filter.
land:
  budgetCents: 0
  minAcreageAcres: 1
  maxAcreageAcres: 0
  # rentcastSecret names a pre-made Secret exposing key NAGUS_RENTCAST_KEY. Leave
  # empty to let rentcastExternalSecret (below) sync it from Vault instead; set it
  # to override with a standalone Secret and skip the ExternalSecret.
  rentcastSecret: ""
  # rentcastExternalSecret syncs the Rentcast key from the SHARED app-source Vault
  # path (eso/nagus/sources, property rentcast_key) into a local Secret exposing
  # NAGUS_RENTCAST_KEY. Same path the eBay creds live under (see externalSecret
  # below) -- one "sources" secret, one per-property mapping.
  rentcastExternalSecret:
    enabled: false
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshInterval: "1h"
    remoteRef:
      key: eso/nagus/sources
      property: rentcast_key

  # zillapiSecret names a pre-made Secret exposing key NAGUS_ZILLAPI_KEY. Leave
  # empty to let zillapiExternalSecret (below) sync it from Vault instead.
  zillapiSecret: ""
  # zillapiExternalSecret syncs the Zillapi API key (zk_...) from the SHARED
  # app-source Vault path (eso/nagus/sources, property zillapi_key) into a local
  # Secret exposing NAGUS_ZILLAPI_KEY -- same path as the Rentcast and eBay creds.
  zillapiExternalSecret:
    enabled: false
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshInterval: "1h"
    remoteRef:
      key: eso/nagus/sources
      property: zillapi_key

# The OFFER LAYER (nagus-q6u). Offers accumulate from every source regardless of
# whether any category currently evaluates them, so activating a category later
# does not start cold, and price history survives for goods nothing scores.
#
# It is ADDITIVE and OPT-IN: disabled leaves the item store, the surface,
# search_items and watches byte-identical to before.
#
# The offer store follows storage.backend, so the two are peer stores:
#   postgres -> its own TABLE SET in the SAME database as items. Backup and
#               restore stay one unit, so item and offer state cannot be
#               restored out of step with each other.
#   sqlite   -> a separate FILE at offers.sqlitePath. SQLite's constraints are
#               real (a VACUUM takes a database-wide lock, the pool is capped at
#               one connection), so sharing a file would put offer maintenance in
#               front of the read path that serves the live surface.
#
# NOTE ON GROWTH: sources with retain-full retention accumulate indefinitely by
# design. On the sqlite backend that file shares the PVC with the item store, so
# watch the volume -- see storage.sqlite.persistence.size.
offers:
  enabled: false
  # Ignored when storage.backend is postgres.
  sqlitePath: /data/nagus-offers.db

# quark: asynchronous product-identity resolution (nagus-6r6). nagus asks quark
# what product each offer's hint names and stamps the answer on the offer. It
# runs outside ingest: quark down or slow leaves offers unattempted and never
# fails an ingest. Requires offers.enabled. OFF while url is empty.
quark:
  # quark's API root, e.g. http://quark.quark.svc.cluster.local:8080
  url: ""
  # How often the pass runs, as a Go duration. Empty = the binary default (10m).
  interval: ""
  # nagus's bearer token, as NAGUS_QUARK_TOKEN. The Vault property is shared
  # with quark's own consumer ExternalSecret.
  tokenExternalSecret:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    remoteRef:
      key: eso/quark/consumers
      property: nagus_bearer_token

# glovebox: the out-of-process sanitize gate every ingested listing crosses
# (nagus-9ib). OFF while sanitizeURL is empty: nagus keeps its in-process
# Passthrough. With sanitizeURL set and the token synced, every listing is
# classified and only verdict=pass is kept (fail closed). With the URL set but
# NO token (a secret that has not synced), nagus still starts -- Recreate makes
# a pod that will not start an outage -- but drops every new listing and says
# why; it never runs ungated.
glovebox:
  # glovebox's sanitize listener, e.g.
  # http://glovebox-glovebox-ingest.glovebox.svc.cluster.local:9093
  sanitizeURL: ""
  # nagus's bearer token (source-id "nagus" in glovebox's registry), as
  # NAGUS_GLOVEBOX_TOKEN. The same value lives at
  # secret/glovebox/ingest-tokens/nagus for glovebox's side.
  tokenExternalSecret:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    remoteRef:
      key: eso/nagus/glovebox-sanitize
      property: TOKEN

# lwin: the Liv-ex LWIN wine dictionary (CC BY), used to resolve wine listings
# to canonical LWIN identities. OFF while url is empty.
#
# The registration form at liv-ex.com/lwin/ leads to a public object that
# Liv-ex refreshes in place; nagus mirrors it onto the data volume, validates
# each download (it must parse to a real dictionary) before it replaces the
# mirror, and keeps the last good copy if the source is down.
lwin:
  # e.g. https://s3-eu-west-1.amazonaws.com/lwin-dictionary/latest/LWINdatabase.xlsx
  url: ""
  # On the data volume. With storage.backend=sqlite that is the PVC and a
  # restart reuses the copy; with postgres it is an emptyDir, so each new pod
  # downloads the export once (~26 MB) and revalidates conditionally after.
  cachePath: /data/lwin/LWINdatabase.xlsx
  # How long a copy is used before asking the source again (a conditional
  # request: an unchanged export costs no download).
  maxAge: 720h
  # Write canonical ids from auto-route matches. OFF = shadow mode: the route,
  # would-be id and score are recorded on each wine item so the false-match
  # rate can be measured first. Keep off until it is under 5%.
  stamp: false

# watches are saved search_items queries + notify thresholds that the /watches
# endpoint evaluates for openclaw's delivery cron (candidates -> quiet inbox,
# strong matches -> ping; audience is routed by openclaw's household resolver).
# When non-empty, the chart renders a ConfigMap and points NAGUS_WATCHES at it.
# See docs/examples/watches.hdd.json for the shape.
watches: []
  # - name: cheap-big-hdd
  #   category: hdd
  #   audience: steve
  #   strong_verdicts: ["great"]

storage:
  # backend: sqlite (default, PVC-backed single file) | postgres (shared CNPG).
  # Both adapters are wired (internal/store/{sqlitestore,postgresstore}).
  # postgres targets the shared CloudNativePG cluster; the database + managed
  # role are provisioned via gitops (design 12.1), and this chart consumes the
  # resulting credentials Secret (storage.postgres.existingSecret). pgvector is
  # deferred: v1 postgres is FTS-only.
  backend: sqlite
  sqlite:
    path: /data/nagus.db
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""
      accessMode: ReadWriteOnce
      # existingClaim, if set, is used instead of creating a PVC.
      existingClaim: ""
  postgres:
    host: postgres-rw.databases-app.svc.cluster.local
    port: 5432
    database: nagus
    sslmode: require
    role: nagus
    # A pod can only mount Secrets in its OWN namespace, but the CNPG managed-role
    # secret (nagus-db-role) is created in databases-app. So -- mirroring the
    # aether/registry pattern in the gitops repo -- the chart syncs the SAME Vault
    # key into a LOCAL basic-auth secret in this namespace, which the Deployment
    # references. Keys: username/password. Set existingSecret to reference a
    # pre-made local secret instead and disable externalSecret below.
    existingSecret: ""
    userKey: username
    passwordKey: password
    externalSecret:
      enabled: true
      secretStoreRef:
        name: vault-backend
        kind: ClusterSecretStore
      refreshInterval: "1h"
      # Vault key + property holding the role password. This is the SAME key the
      # gitops externalsecret-nagus-role.yaml uses, so both the managed role and
      # this consumer secret derive from one source of truth.
      remoteRef:
        key: eso/nagus/infrastructure
        property: postgres_password

# externalSecret renders an external-secrets.io ExternalSecret that syncs the
# eBay credentials from the shared app-source Vault path (eso/nagus/sources) into
# a k8s Secret consumed by the Deployment. Same path Rentcast lives under (see
# land.rentcastExternalSecret) -- properties are namespaced per source.
externalSecret:
  enabled: false
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h"
  # target Secret name to create; defaults to "<fullname>-ebay" when empty.
  targetName: ""
  # data maps k8s Secret keys <- Vault paths.
  data: []
  #  - secretKey: NAGUS_EBAY_CLIENT_ID
  #    remoteRef:
  #      key: eso/nagus/sources
  #      property: ebay_client_id
  #  - secretKey: NAGUS_EBAY_CLIENT_SECRET
  #    remoteRef:
  #      key: eso/nagus/sources
  #      property: ebay_client_secret

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    # 384Mi, up from 256Mi, for the LWIN dictionary (~55 MiB resident; the
    # Go runtime peaked ~180 MiB while building it). GOMEMLIMIT follows this.
    memory: 384Mi

nodeSelector: {}
tolerations: []
affinity: {}

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 10

# Prometheus scraping of /metrics (nagus-ff4). Needs the prometheus-operator
# CRDs; the templates render nothing where they are absent.
serviceMonitor:
  enabled: true
  interval: 60s
  scrapeTimeout: 10s

alerts:
  enabled: true
  sanitize:
    # NagusSanitizeDroppingEverything: more than dropRatio of at least
    # minListings listings dropped over 30m, sustained for `for`.
    dropRatio: 0.9
    minListings: 20
    for: 15m
  quark:
    # No clean resolution pass for this long fires NagusQuarkEnrichmentStalled.
    # 3x the default 10m pass interval: one slow or failed pass is not news,
    # three in a row is.
    stallSeconds: 1800
    for: 15m
