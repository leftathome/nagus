{{- if and .Values.quark.url .Values.quark.tokenExternalSecret.enabled -}}
# nagus's bearer token for quark (nagus-6r6). quark's own namespace syncs the
# SAME Vault property into QUARK_AUTH_TOKEN_NAGUS, so one Vault write rotates
# both ends. The env ref in the Deployment is optional: until this Secret
# exists the resolution pass is simply off, never a pod that cannot start.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-quark" (include "nagus.fullname" .) }}
  labels:
    {{- include "nagus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.quark.tokenExternalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.quark.tokenExternalSecret.secretStoreRef.name }}
    kind: {{ .Values.quark.tokenExternalSecret.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-quark" (include "nagus.fullname" .) }}
    creationPolicy: Owner
  data:
    - secretKey: NAGUS_QUARK_TOKEN
      remoteRef:
        key: {{ .Values.quark.tokenExternalSecret.remoteRef.key | quote }}
        property: {{ .Values.quark.tokenExternalSecret.remoteRef.property | quote }}
{{- end }}
