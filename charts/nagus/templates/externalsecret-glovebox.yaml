{{- if and .Values.glovebox.sanitizeURL .Values.glovebox.tokenExternalSecret.enabled -}}
# nagus's bearer token for glovebox's sanitize gate (nagus-9ib). glovebox reads
# the SAME value from secret/glovebox/ingest-tokens/nagus; rotate both, then
# SIGHUP glovebox. The env ref is optional: until this Secret exists the gate
# drops every new listing (fail closed) rather than holding the pod.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-glovebox" (include "nagus.fullname" .) }}
  labels:
    {{- include "nagus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.glovebox.tokenExternalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.glovebox.tokenExternalSecret.secretStoreRef.name }}
    kind: {{ .Values.glovebox.tokenExternalSecret.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-glovebox" (include "nagus.fullname" .) }}
    creationPolicy: Owner
  data:
    - secretKey: NAGUS_GLOVEBOX_TOKEN
      remoteRef:
        key: {{ .Values.glovebox.tokenExternalSecret.remoteRef.key | quote }}
        property: {{ .Values.glovebox.tokenExternalSecret.remoteRef.property | quote }}
{{- end }}
