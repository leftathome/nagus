{{- if and .Values.vision.baseURL .Values.vision.apiKeyExternalSecret.enabled -}}
# nagus's API key for the OpenAI-compatible vision endpoint (nagus-3ua,
# promo-vision-v1). The Deployment references it optionally: until this
# Secret exists promo reading is simply off, never a pod that cannot start.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-vision" (include "nagus.fullname" .) }}
  labels:
    {{- include "nagus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vision.apiKeyExternalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.vision.apiKeyExternalSecret.secretStoreRef.name }}
    kind: {{ .Values.vision.apiKeyExternalSecret.secretStoreRef.kind }}
  target:
    name: {{ printf "%s-vision" (include "nagus.fullname" .) }}
    creationPolicy: Owner
  data:
    - secretKey: NAGUS_VISION_API_KEY
      remoteRef:
        key: {{ .Values.vision.apiKeyExternalSecret.remoteRef.key | quote }}
        property: {{ .Values.vision.apiKeyExternalSecret.remoteRef.property | quote }}
{{- end }}
