apiVersion: v2
name: nagus
description: >-
  nagus acquisition/watch subsystem -- the HDD deal-watch vertical slice
  (collect -> store -> hard-filter -> $/TB valuation -> score -> read-only
  search_items surface). sqlite-backed by default; structured to expand to more
  categories and to the shared Postgres/CNPG backend without restructuring.
type: application
# version is the chart version; appVersion tracks the nagus image tag.
# 0.3.0: land acquisition moves to Zillapi -- adds the zillapi ExternalSecret and
# NAGUS_ZILLAPI_KEY env, and REMOVES the craigslist values/env (land.craigslistCity,
# land.craigslistCategory, NAGUS_CL_*). Bumped so Flux pulls the new templates.
# 0.2.0: multi-source/multi-category deployment (dgq) -- renders config.json
# (sources[]+categories{}) when .Values.sources is set; legacy single-category
# render unchanged.
version: 0.3.0
appVersion: "0.2.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - acquisition
  - watch
  - deal-watch
  - hdd
sources:
  - https://gitlab.orac.local/homelab/nagus
maintainers:
  - name: Steven Wagner
