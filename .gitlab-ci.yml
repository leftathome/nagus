# GitLab CI for gitlab.orac.local (agentic/nagus).
#
# PRIMARY (gitlab-first) build + publish pipeline, mirroring glovebox: an MR/main
# unit gate (vet + race tests), then a kaniko image build, an OCI Helm chart
# push, and a GitLab Release on tags.
#
# All homelab-infra detail (kaniko CA workaround, the in-cluster registry
# Service, node pinning + pod sizing) lives in the PRIVATE homelab/ci-templates
# project and is pulled in via the include below. This file is mirrored to
# public GitHub, so it deliberately carries NO cluster specifics -- only the
# non-sensitive, project-specific wiring (image name, chart path).
#
# GitHub Actions (.github/workflows/) is the downstream public mirror that
# publishes the SAME image + chart to ghcr.io/leftathome for the HelmRelease to
# consume; tag/version conventions are kept in sync.

include:
  - project: 'homelab/ci-templates'
    ref: v0.2.1
    file: '/kaniko.yml'

stages:
  - test
  - vulncheck
  - build
  - chart
  - release

variables:
  # The Go toolchain for the GATES (test + vulncheck). Pinned to an explicit
  # patch version, and it MUST equal the version the Dockerfile's digest-pinned
  # builder resolves to -- golang:1.26.6 amd64 is
  # sha256:23fdfd3a6abc97c81e32a724cdd1cf541c06c416eb04d717815f4ed7c75623d0,
  # which is exactly the Dockerfile's build-amd64 pin. Bump both together.
  #
  # WHY PINNED (nagus-ghb, 2026-08-30). This was the floating tag `golang:1.26`,
  # and a floating tag does NOT mean current: the GitLab Kubernetes executor logs
  # "Using effective pull policy of []", so a node that cached golang:1.26 months
  # ago keeps serving it. The gates were measured running go1.26.4 while the
  # shipped image built on 1.26.6 -- the gates tested an OLDER stdlib than the
  # artifact. govulncheck then failed main for 11 days on seven stdlib CVEs that
  # were already fixed in the binary we ship. Same reasoning as the pinned
  # govulncheck version below: a gate whose verdict depends on what a node
  # happened to cache is not a gate.
  GO_IMAGE: "golang:1.26.6"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOFLAGS: "-mod=mod"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go/pkg/mod
    - .cache/go-build

# Build/publish only on main and tags. The leading never-guard keeps scheduled
# (nightly) or manual (web) pipelines from rebuilding on a main ref -- matches
# glovebox even though nagus has no scheduled pipeline yet.
# Retry policy (nagus-sc5, 2026-08-30). Pipeline #2203 failed build-arm64 with
# "fatal: unable to access 'https://gitlab.orac.local/...': The requested URL
# returned error: 500" -- a transient 500 from GitLab itself during get_sources.
# It never reached kaniko. One infrastructure hiccup reddened the pipeline and
# skipped the downstream build/chart jobs, and because it was indistinguishable
# at a glance from a real break, main sat red for 11 days.
#
# TWO POLICIES ON PURPOSE, because retrying is not free of risk:
#   *infra_retry  -- infrastructure classes only. Safe everywhere: none of these
#                    can be caused by the code under test.
#   *build_retry  -- adds script_failure, for the image-build legs ONLY. A
#                    get_sources clone failure surfaces as script_failure, so
#                    excluding it would not have caught the actual incident.
# The gates (test, vulncheck) deliberately get *infra_retry and NOT
# script_failure: a failing test or a real CVE must not be re-rolled until it
# passes. That would be exactly the "failure looks like success" pattern this
# repo keeps getting bitten by. A genuinely broken build still fails after its
# retries -- retry delays the report, it never suppresses it.
.infra_retry: &infra_retry
  max: 2
  when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - api_failure
    - scheduler_failure

.build_retry: &build_retry
  max: 2
  when:
    - runner_system_failure
    - stuck_or_timeout_failure
    - api_failure
    - scheduler_failure
    - script_failure

.build_rules: &build_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# vulncheck -- govulncheck against the Go vulnerability database. A SEPARATE
# stage on purpose, matching homelab/go-service-template: a new CVE disclosure
# is then distinguishable at a glance from a broken test, and it fails the
# pipeline rather than shipping quietly.
#
# WHY THIS EXISTS HERE (added 2026-08-19). nagus had no vulncheck at all, and
# the gates could disagree with the artifact about which stdlib was in play.
# govulncheck against the pinned builder found 7 vulnerabilities -- 6 stdlib,
# plus GO-2026-5970 (infinite loop in golang.org/x/text) reachable via
# pgoffer.New -> pgxpool.New -> norm.Form. Fixed in the same commit that added
# this stage; the gate is what stops it recurring silently.
#
# CORRECTION (2026-08-30, nagus-ghb). This comment used to claim the skew ran
# one way -- that the gates were on a floating tag "so already 1.26.6" while the
# Dockerfile pinned 1.26.5. That was backwards, and it kept main red for 11 days
# because the failure was read as a real CVE report. Measured: the gates were
# running go1.26.4 (pipeline #2275 job 19027 printed it) while the Dockerfile's
# digest builds 1.26.6. The gates were OLDER than the artifact, so govulncheck
# was reporting stdlib CVEs -- "Found in: crypto/tls@go1.26.4, Fixed in:
# go1.26.5" -- that are absent from the binary we actually ship. A floating tag
# is not a version: with the k8s executor's default pull policy, whatever the
# node cached is what you get. Hence GO_IMAGE is pinned at the top of this file
# and must be bumped together with the Dockerfile's builder digests.
#
# The lesson generalizes: a gate is only evidence if it runs against the thing
# that ships. Compare the repo's other traps in CLAUDE.md -- each one is a case
# of a green signal that was measuring the wrong object.
#
# Pinned govulncheck version, matching go-service-kit and the template: an
# unpinned @latest makes the gate's verdict depend on when it ran.
# ---------------------------------------------------------------------------
vulncheck:
  stage: vulncheck
  image: $GO_IMAGE
  retry: *infra_retry
  before_script:
    - "go version"
  script:
    - "go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./..."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test -- the MR/main unit gate (vet + race). Node selector / pod sizing come
# from the included homelab/ci-templates global variables.
#
# The postgresstore/pgoffer contract tests are gated on
# NAGUS_TEST_POSTGRES_DSN and skip themselves when it is unset, so without a
# real Postgres here they ran at 0% coverage. The postgres service below gives
# them one; GitLab resolves the service hostname as "postgres".
# ---------------------------------------------------------------------------
test:
  stage: test
  image: $GO_IMAGE
  retry: *infra_retry
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_USER: nagus
    POSTGRES_PASSWORD: nagus
    POSTGRES_DB: nagus_test
    NAGUS_TEST_POSTGRES_DSN: "postgres://nagus:nagus@postgres:5432/nagus_test?sslmode=disable"
  before_script:
    - "go version"
    - "go env GOPATH GOMODCACHE GOCACHE"
  script:
    - "go vet ./..."
    - "go test ./... -count=1 -race"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# build -- the distroless image (CGO-free static binary + pure-Go sqlite), built
# MULTI-ARCH. orac is a mixed-architecture cluster (johnny/venus amd64; bailey
# and orac01-04 arm64), and a single-arch image runs only where the scheduler
# happens to place it -- an amd64-only nagus crashlooped with "exec format
# error" after being scheduled onto orac04, taking the service down because the
# chart uses strategy: Recreate (nagus-viw).
#
# Three jobs, per the ci-templates recipe: two NATIVE per-arch legs (no QEMU --
# emulation would need a privileged binfmt DaemonSet this cluster does not have)
# publishing only the immutable :<sha>-<arch> tags, then a crane merge that
# publishes the tags we actually deploy (:<sha>, :latest, :<semver>) as an index
# over those two. Sourcing the index from immutable per-commit tags is what stops
# two concurrent pipelines stitching an index whose halves are different commits.
#
# Do NOT set MULTIARCH here; the legs assert it themselves. Setting it on one leg
# only would make the other publish to the unsuffixed tags and quietly leave
# :latest single-arch.
# ---------------------------------------------------------------------------
build-amd64:
  extends: .kaniko-build-amd64
  stage: build
  needs: ["test"]
  retry: *build_retry
  rules: *build_rules
  variables:
    IMAGE: nagus
    DOCKERFILE: ./Dockerfile

build-arm64:
  extends: .kaniko-build-arm64
  stage: build
  needs: ["test"]
  retry: *build_retry
  rules: *build_rules
  variables:
    IMAGE: nagus
    DOCKERFILE: ./Dockerfile

# The index. This is the job whose output the HelmRelease consumes -- the legs'
# per-arch tags are an implementation detail and are never deployed directly.
build:
  extends: .manifest-merge
  stage: build
  needs: ["build-amd64", "build-arm64"]
  rules: *build_rules
  variables:
    IMAGE: nagus

# ---------------------------------------------------------------------------
# chart -- package + push charts/nagus as an OCI artifact. On a tag the template
# stamps chart version/appVersion from the tag.
# ---------------------------------------------------------------------------
chart:
  extends: .helm-push
  stage: chart
  needs: ["build"]
  rules: *build_rules
  variables:
    CHART_PATH: charts/nagus

# ---------------------------------------------------------------------------
# release -- create a GitLab Release for the tag. allow_failure while the orac
# private CA is not trusted in the runner image (release-cli talks to the GitLab
# API over HTTPS; the images + chart are already published by this stage). Same
# rationale as glovebox; drop allow_failure once the CA is trusted.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
