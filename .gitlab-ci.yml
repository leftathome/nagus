# GitLab CI for gitlab.orac.local (agentic/nagus).
#
# PRIMARY (gitlab-first) build + publish pipeline, mirroring glovebox: an MR/main
# unit gate (vet + race tests), then a kaniko image build, an OCI Helm chart
# push, and a GitLab Release on tags.
#
# All homelab-infra detail (kaniko CA workaround, the in-cluster registry
# Service, node pinning + pod sizing) lives in the PRIVATE homelab/ci-templates
# project and is pulled in via the include below. This file is mirrored to
# public GitHub, so it deliberately carries NO cluster specifics -- only the
# non-sensitive, project-specific wiring (image name, chart path).
#
# GitHub Actions (.github/workflows/) is the downstream public mirror that
# publishes the SAME image + chart to ghcr.io/leftathome for the HelmRelease to
# consume; tag/version conventions are kept in sync.

include:
  - project: 'homelab/ci-templates'
    ref: v0.2.1
    file: '/kaniko.yml'

stages:
  - test
  - vulncheck
  - build
  - chart
  - release

variables:
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOFLAGS: "-mod=mod"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go/pkg/mod
    - .cache/go-build

# Build/publish only on main and tags. The leading never-guard keeps scheduled
# (nightly) or manual (web) pipelines from rebuilding on a main ref -- matches
# glovebox even though nagus has no scheduled pipeline yet.
.build_rules: &build_rules
  - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
    when: never
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# vulncheck -- govulncheck against the Go vulnerability database. A SEPARATE
# stage on purpose, matching homelab/go-service-template: a new CVE disclosure
# is then distinguishable at a glance from a broken test, and it fails the
# pipeline rather than shipping quietly.
#
# WHY THIS EXISTS HERE (added 2026-08-19). nagus had no vulncheck at all, and
# the gap had the most dangerous possible shape: the gates ran on the FLOATING
# `golang:1.26` (so already 1.26.6) while the Dockerfile pinned 1.26.5 by
# digest. Green pipelines, shipping a binary built on a stdlib the gates never
# tested. govulncheck against the pinned builder found 7 vulnerabilities --
# 6 stdlib, plus GO-2026-5970 (infinite loop in golang.org/x/text) reachable
# via pgoffer.New -> pgxpool.New -> norm.Form. Fixed in the same commit that
# added this stage; the gate is what stops it recurring silently.
#
# Pinned govulncheck version, matching go-service-kit and the template: an
# unpinned @latest makes the gate's verdict depend on when it ran.
# ---------------------------------------------------------------------------
vulncheck:
  stage: vulncheck
  image: golang:1.26
  before_script:
    - "go version"
  script:
    - "go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./..."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test -- the MR/main unit gate (vet + race). Node selector / pod sizing come
# from the included homelab/ci-templates global variables.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: golang:1.26
  before_script:
    - "go version"
    - "go env GOPATH GOMODCACHE GOCACHE"
  script:
    - "go vet ./..."
    - "go test ./... -count=1 -race"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# build -- the distroless image (CGO-free static binary + pure-Go sqlite), built
# MULTI-ARCH. orac is a mixed-architecture cluster (johnny/venus amd64; bailey
# and orac01-04 arm64), and a single-arch image runs only where the scheduler
# happens to place it -- an amd64-only nagus crashlooped with "exec format
# error" after being scheduled onto orac04, taking the service down because the
# chart uses strategy: Recreate (nagus-viw).
#
# Three jobs, per the ci-templates recipe: two NATIVE per-arch legs (no QEMU --
# emulation would need a privileged binfmt DaemonSet this cluster does not have)
# publishing only the immutable :<sha>-<arch> tags, then a crane merge that
# publishes the tags we actually deploy (:<sha>, :latest, :<semver>) as an index
# over those two. Sourcing the index from immutable per-commit tags is what stops
# two concurrent pipelines stitching an index whose halves are different commits.
#
# Do NOT set MULTIARCH here; the legs assert it themselves. Setting it on one leg
# only would make the other publish to the unsuffixed tags and quietly leave
# :latest single-arch.
# ---------------------------------------------------------------------------
build-amd64:
  extends: .kaniko-build-amd64
  stage: build
  needs: ["test"]
  rules: *build_rules
  variables:
    IMAGE: nagus
    DOCKERFILE: ./Dockerfile

build-arm64:
  extends: .kaniko-build-arm64
  stage: build
  needs: ["test"]
  rules: *build_rules
  variables:
    IMAGE: nagus
    DOCKERFILE: ./Dockerfile

# The index. This is the job whose output the HelmRelease consumes -- the legs'
# per-arch tags are an implementation detail and are never deployed directly.
build:
  extends: .manifest-merge
  stage: build
  needs: ["build-amd64", "build-arm64"]
  rules: *build_rules
  variables:
    IMAGE: nagus

# ---------------------------------------------------------------------------
# chart -- package + push charts/nagus as an OCI artifact. On a tag the template
# stamps chart version/appVersion from the tag.
# ---------------------------------------------------------------------------
chart:
  extends: .helm-push
  stage: chart
  needs: ["build"]
  rules: *build_rules
  variables:
    CHART_PATH: charts/nagus

# ---------------------------------------------------------------------------
# release -- create a GitLab Release for the tag. allow_failure while the orac
# private CA is not trusted in the runner image (release-cli talks to the GitLab
# API over HTTPS; the images + chart are already published by this stage). Same
# rationale as glovebox; drop allow_failure once the CA is trusted.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
